#############################################
# Filament Change wizard for Ender-3 V3 KE
# Uses the existing slicer PAUSE workflow.
# It does not create a pause and does not use M600.
#############################################

[gcode_macro FILAMENT_CHANGE]
description: Open the Filament Change wizard while paused
variable_state: 0
variable_saved_temp: 0
variable_saved_fan: 0
gcode:
    {% set p = printer.pause_resume %}
    {% if not p.is_paused %}
        {action_respond_info("Filament Change: start a PAUSE from the slicer first")}
    {% elif printer["gcode_macro FILAMENT_CHANGE"].state|int != 0 %}
        {action_respond_info("Filament Change: wizard is already active")}
    {% else %}
        {% set saved_temp = printer["gcode_macro PRINTER_PARAM"].hotend_temp|float %}
        {% if saved_temp < 170 %}
            {% set saved_temp = printer.extruder.target|float %}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=FILAMENT_CHANGE VARIABLE=saved_temp VALUE={saved_temp}
        SET_GCODE_VARIABLE MACRO=FILAMENT_CHANGE VARIABLE=saved_fan VALUE={printer["output_pin fan0"].value|float}
        SET_GCODE_VARIABLE MACRO=FILAMENT_CHANGE VARIABLE=state VALUE=1

        # The existing PAUSE already parked the head and set the hotend to 140 C.
        # Reheat to the print temperature before unloading.
        M117 Filament Change: heating
        M109 S{saved_temp}
        M83
        G1 E20 F180
        G1 E-30 F180
        G1 E-50 F2000
        M400
        M104 S140
        M107

        RESPOND TYPE=command MSG="action:prompt_begin Filament Change"
        RESPOND TYPE=command MSG="action:prompt_text Pull back the extruder lever and remove the filament."
        RESPOND TYPE=command MSG="action:prompt_footer_button Filament removed|FILAMENT_CHANGE_REMOVED|primary"
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|FILAMENT_CHANGE_CANCEL|error"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

[gcode_macro FILAMENT_CHANGE_REMOVED]
description: Confirm that the old filament was removed
variable_dummy: 0
gcode:
    {% if printer["gcode_macro FILAMENT_CHANGE"].state|int != 1 %}
        {action_respond_info("Filament Change: no active wizard")}
    {% else %}
        SET_GCODE_VARIABLE MACRO=FILAMENT_CHANGE VARIABLE=state VALUE=2
        RESPOND TYPE=command MSG="action:prompt_end"
        RESPOND TYPE=command MSG="action:prompt_begin Select new filament"
        RESPOND TYPE=command MSG="action:prompt_text Open Spoolman, select the new spool, make it active, return here, then press Continue."
        RESPOND TYPE=command MSG="action:prompt_button Open Spoolman|prompt_spoolman|secondary"
        RESPOND TYPE=command MSG="action:prompt_footer_button Continue|FILAMENT_CHANGE_SPOOL_SELECTED|primary"
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|FILAMENT_CHANGE_CANCEL|error"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

[gcode_macro FILAMENT_CHANGE_SPOOL_SELECTED]
description: Confirm the new active Spoolman spool
variable_dummy: 0
gcode:
    {% if printer["gcode_macro FILAMENT_CHANGE"].state|int != 2 %}
        {action_respond_info("Filament Change: select the new spool first")}
    {% else %}
        SET_GCODE_VARIABLE MACRO=FILAMENT_CHANGE VARIABLE=state VALUE=3
        RESPOND TYPE=command MSG="action:prompt_end"
        RESPOND TYPE=command MSG="action:prompt_begin Insert new filament"
        RESPOND TYPE=command MSG="action:prompt_text Insert the new filament into the extruder and release the lever."
        RESPOND TYPE=command MSG="action:prompt_footer_button Filament inserted|FILAMENT_CHANGE_LOAD|primary"
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|FILAMENT_CHANGE_CANCEL|error"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

[gcode_macro FILAMENT_CHANGE_LOAD]
description: Heat, load and purge the new filament
variable_dummy: 0
gcode:
    {% set state = printer["gcode_macro FILAMENT_CHANGE"].state|int %}
    {% set temp = printer["gcode_macro FILAMENT_CHANGE"].saved_temp|float %}
    {% if state != 3 %}
        {action_respond_info("Filament Change: the new filament is not ready")}
    {% elif temp < 170 %}
        FILAMENT_CHANGE_CANCEL
        {action_raise_error("Filament Change: invalid saved print temperature")}
    {% else %}
        SET_GCODE_VARIABLE MACRO=FILAMENT_CHANGE VARIABLE=state VALUE=4
        RESPOND TYPE=command MSG="action:prompt_end"
        RESPOND TYPE=command MSG="action:prompt_begin Loading filament"
        RESPOND TYPE=command MSG="action:prompt_text Heating to the print temperature and loading filament..."
        RESPOND TYPE=command MSG="action:prompt_progress 0"
        RESPOND TYPE=command MSG="action:prompt_show"

        M109 S{temp}
        M83
        RESPOND TYPE=command MSG="action:prompt_progress 25"
        G1 E50 F300
        RESPOND TYPE=command MSG="action:prompt_progress 65"
        G1 E25 F120
        RESPOND TYPE=command MSG="action:prompt_progress 90"
        G1 E15 F90
        M400
        RESPOND TYPE=command MSG="action:prompt_progress 100"

        RESPOND TYPE=command MSG="action:prompt_end"
        RESPOND TYPE=command MSG="action:prompt_begin Filament ready"
        RESPOND TYPE=command MSG="action:prompt_text Remove the purged plastic from the nozzle. Continue only after the nozzle is clear."
        RESPOND TYPE=command MSG="action:prompt_footer_button Continue print|FILAMENT_CHANGE_RESUME|primary"
        RESPOND TYPE=command MSG="action:prompt_footer_button Back to macros|FILAMENT_CHANGE_FINISH|secondary"
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel print|CANCEL_PRINT|error"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

[gcode_macro FILAMENT_CHANGE_RESUME]
description: Finish Filament Change and resume the paused print
gcode:
    {% if printer["gcode_macro FILAMENT_CHANGE"].state|int != 4 %}
        {action_respond_info("Filament Change: loading has not finished")}
    {% else %}
        {% set fan = printer["gcode_macro FILAMENT_CHANGE"].saved_fan|float %}
        SET_GCODE_VARIABLE MACRO=FILAMENT_CHANGE VARIABLE=state VALUE=0
        SET_GCODE_VARIABLE MACRO=PRINTER_PARAM VARIABLE=hotend_temp VALUE=0
        RESPOND TYPE=command MSG="action:prompt_end"
        M106 S{(fan * 255)|int}
        M117 Resuming print
        RESUME
    {% endif %}

[gcode_macro FILAMENT_CHANGE_FINISH]
description: Close the wizard and keep the print paused
gcode:
    SET_GCODE_VARIABLE MACRO=FILAMENT_CHANGE VARIABLE=state VALUE=0
    RESPOND TYPE=command MSG="action:prompt_end"
    M117 Print remains paused

[gcode_macro FILAMENT_CHANGE_CANCEL]
description: Cancel the Filament Change wizard and keep the print paused
gcode:
    SET_GCODE_VARIABLE MACRO=FILAMENT_CHANGE VARIABLE=state VALUE=0
    RESPOND TYPE=command MSG="action:prompt_end"
    M117 Filament Change cancelled
    RESPOND TYPE=command MSG="Filament Change cancelled. The print is still paused."

[delayed_gcode FILAMENT_CHANGE_RESET]
initial_duration: 0
gcode:
    SET_GCODE_VARIABLE MACRO=FILAMENT_CHANGE VARIABLE=state VALUE=0
