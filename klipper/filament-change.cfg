#############################################
# Filament Change wizard for Ender-3 V3 KE
# Run FILAMENT_CHANGE from the GuppyScreen/Fluidd macro list:
#  - while printing: asks to pause, then changes filament and resumes
#  - while paused:   changes filament and resumes
#  - while idle:     asks for a temperature and just swaps filament
# Helper macros start with "_" so they stay hidden in macro lists.
#
# GuppyScreen notes: it only drops old buttons on prompt_end, so every new
# dialog starts with one; and it lays buttons out in a single row, so no
# dialog has more than four.
#############################################

# Spool picker (klippy/extras/fc_spoolman.py), uses Moonraker's [spoolman]
[fc_spoolman]

[gcode_macro FILAMENT_CHANGE]
description: Open the Filament Change wizard
# state: 0 idle, 1 heating to unload, 2 unloading, 3 waiting for removal,
#        4 choosing spool / inserting, 5 heating to load, 6 loading, 7 done
variable_state: 0
# mode: 0 standalone (no print), 1 paused print
variable_mode: 0
variable_saved_temp: 0
variable_saved_fan: 0
gcode:
    {% set ps = printer.print_stats.state %}
    {% if state|int != 0 %}
        _FC_STEP_PROMPT
    {% elif printer.pause_resume.is_paused %}
        _FC_START
    {% elif ps == "printing" %}
        RESPOND TYPE=command MSG="action:prompt_end"
        RESPOND TYPE=command MSG="action:prompt_begin Filament Change"
        RESPOND TYPE=command MSG="action:prompt_text The print will pause and park the head. Nozzle now {printer.extruder.temperature|int}C."
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_FC_CLOSE|secondary"
        RESPOND TYPE=command MSG="action:prompt_footer_button Pause and change|_FC_PAUSE_AND_START|primary"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_end"
        RESPOND TYPE=command MSG="action:prompt_begin Filament Change"
        RESPOND TYPE=command MSG="action:prompt_text Nozzle now {printer.extruder.temperature|int}C. Pick the filament that is loaded now:"
        RESPOND TYPE=command MSG="action:prompt_button PLA 210C|_FC_START TEMP=210|primary"
        RESPOND TYPE=command MSG="action:prompt_button TPU 230C|_FC_START TEMP=230|primary"
        RESPOND TYPE=command MSG="action:prompt_button PETG 240C|_FC_START TEMP=240|primary"
        RESPOND TYPE=command MSG="action:prompt_button ABS 250C|_FC_START TEMP=250|primary"
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_FC_CLOSE|secondary"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

[gcode_macro _FC_PAUSE_AND_START]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    PAUSE
    _FC_START

[gcode_macro _FC_START]
gcode:
    {% set paused = printer.pause_resume.is_paused %}
    {% if paused %}
        # PAUSE stores the print temperature and drops the nozzle to 140C
        {% set temp = params.TEMP|default(printer["gcode_macro PRINTER_PARAM"].hotend_temp)|float %}
        {% if temp < 170 %}
            {% set temp = printer.extruder.target|float %}
        {% endif %}
    {% else %}
        {% set temp = params.TEMP|default(0)|float %}
    {% endif %}
    {% if temp < 170 %}
        RESPOND TYPE=command MSG="action:prompt_end"
        {action_raise_error("Filament Change: nozzle temperature is below 170C")}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=FILAMENT_CHANGE VARIABLE=mode VALUE={1 if paused else 0}
    SET_GCODE_VARIABLE MACRO=FILAMENT_CHANGE VARIABLE=saved_temp VALUE={temp}
    SET_GCODE_VARIABLE MACRO=FILAMENT_CHANGE VARIABLE=saved_fan VALUE={printer['output_pin fan0'].value}
    SET_GCODE_VARIABLE MACRO=FILAMENT_CHANGE VARIABLE=state VALUE=1
    SAVE_GCODE_STATE NAME=filament_change
    _FC_HEAT

# Heating runs as a timer instead of M109 so the dialog can show the live
# temperature and Cancel keeps working while the nozzle heats.
[gcode_macro _FC_HEAT]
gcode:
    M104 S{printer["gcode_macro FILAMENT_CHANGE"].saved_temp}
    _FC_HEAT_SHOW
    UPDATE_DELAYED_GCODE ID=_FC_HEAT_TICK DURATION=1.5

[gcode_macro _FC_HEAT_SHOW]
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    _FC_HEAT_PROMPT
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_FC_CANCEL|error"
    RESPOND TYPE=command MSG="action:prompt_show"

# Header and text only: GuppyScreen keeps the Cancel button from _FC_HEAT_SHOW
[gcode_macro _FC_HEAT_PROMPT]
gcode:
    {% set fc = printer["gcode_macro FILAMENT_CHANGE"] %}
    {% set cur = printer.extruder.temperature|float %}
    {% set target = fc.saved_temp|float %}
    {% set pct = ((cur - 25) / (target - 25) * 100)|int %}
    {% set pct = [[pct, 0]|max, 100]|min %}
    {% set n = (pct / 5)|int %}
    {% set bar = "[" ~ ("=" * n) ~ ("." * (20 - n)) ~ "]" %}
    {% if fc.state|int == 1 %}
        {% set title = "Step 1/4 - Heating to unload" %}
    {% else %}
        {% set title = "Step 4/4 - Heating to load" %}
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_begin {title}"
    RESPOND TYPE=command MSG="action:prompt_text Nozzle {cur|int}C / {target|int}C   {bar} {pct}%"
    RESPOND TYPE=command MSG="action:prompt_show"

[delayed_gcode _FC_HEAT_TICK]
gcode:
    {% set fc = printer["gcode_macro FILAMENT_CHANGE"] %}
    {% set state = fc.state|int %}
    {% if state == 1 or state == 5 %}
        {% if printer.extruder.temperature >= fc.saved_temp - 2 %}
            M109 S{fc.saved_temp}
            {% if state == 1 %}
                _FC_UNLOAD
            {% else %}
                _FC_LOAD_RUN
            {% endif %}
        {% else %}
            _FC_HEAT_PROMPT
            UPDATE_DELAYED_GCODE ID=_FC_HEAT_TICK DURATION=1.5
        {% endif %}
    {% endif %}

[gcode_macro _FC_UNLOAD]
gcode:
    SET_GCODE_VARIABLE MACRO=FILAMENT_CHANGE VARIABLE=state VALUE=2
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_begin Step 1/4 - Unloading"
    RESPOND TYPE=command MSG="action:prompt_text Softening the tip...   [=======.............] 33%"
    RESPOND TYPE=command MSG="action:prompt_show"
    M83
    G1 E20 F180
    M400
    RESPOND TYPE=command MSG="action:prompt_begin Step 1/4 - Unloading"
    RESPOND TYPE=command MSG="action:prompt_text Pulling back slowly...   [=============.......] 66%"
    RESPOND TYPE=command MSG="action:prompt_show"
    G1 E-30 F180
    M400
    RESPOND TYPE=command MSG="action:prompt_begin Step 1/4 - Unloading"
    RESPOND TYPE=command MSG="action:prompt_text Ejecting...   [====================] 100%"
    RESPOND TYPE=command MSG="action:prompt_show"
    G1 E-50 F2000
    M400
    M104 S140
    M107
    SET_GCODE_VARIABLE MACRO=FILAMENT_CHANGE VARIABLE=state VALUE=3
    _FC_STEP_PROMPT

# Shows the dialog for the current step; also used to get back into the
# wizard after its dialog was closed
[gcode_macro _FC_STEP_PROMPT]
gcode:
    {% set state = printer["gcode_macro FILAMENT_CHANGE"].state|int %}
    {% if state == 1 or state == 5 %}
        _FC_HEAT_SHOW
    {% elif state == 3 %}
        RESPOND TYPE=command MSG="action:prompt_end"
        RESPOND TYPE=command MSG="action:prompt_begin Step 2/4 - Remove filament"
        RESPOND TYPE=command MSG="action:prompt_text Pull back the extruder lever and take the old filament out. Nozzle is kept warm at {printer.extruder.target|int}C."
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_FC_CANCEL|error"
        RESPOND TYPE=command MSG="action:prompt_footer_button Filament removed|_FC_REMOVED|primary"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% elif state == 4 %}
        FC_SPOOL_PROMPT SELECT=_FC_SPOOL_SELECTED CANCEL=_FC_CANCEL
    {% elif state == 7 %}
        _FC_FINAL_PROMPT
    {% endif %}

[gcode_macro _FC_REMOVED]
gcode:
    {% if printer["gcode_macro FILAMENT_CHANGE"].state|int != 3 %}
        {action_respond_info("Filament Change: no active wizard")}
    {% else %}
        SET_GCODE_VARIABLE MACRO=FILAMENT_CHANGE VARIABLE=state VALUE=4
        FC_SPOOL_PROMPT SELECT=_FC_SPOOL_SELECTED CANCEL=_FC_CANCEL
    {% endif %}

[gcode_macro _FC_SPOOL_SELECTED]
gcode:
    {% if printer["gcode_macro FILAMENT_CHANGE"].state|int != 4 %}
        {action_respond_info("Filament Change: no active wizard")}
    {% else %}
        {% if params.ID|default(0)|int > 0 %}
            SET_ACTIVE_SPOOL ID={params.ID|int}
        {% endif %}
        RESPOND TYPE=command MSG="action:prompt_end"
        RESPOND TYPE=command MSG="action:prompt_begin Step 3/4 - Insert filament"
        RESPOND TYPE=command MSG="action:prompt_text Push the new filament through the extruder until it stops, then release the lever."
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_FC_CANCEL|error"
        RESPOND TYPE=command MSG="action:prompt_footer_button Filament inserted|_FC_LOAD|primary"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}

[gcode_macro _FC_LOAD]
gcode:
    {% if printer["gcode_macro FILAMENT_CHANGE"].state|int != 4 %}
        {action_respond_info("Filament Change: insert the new filament first")}
    {% else %}
        SET_GCODE_VARIABLE MACRO=FILAMENT_CHANGE VARIABLE=state VALUE=5
        _FC_HEAT
    {% endif %}

[gcode_macro _FC_LOAD_RUN]
gcode:
    SET_GCODE_VARIABLE MACRO=FILAMENT_CHANGE VARIABLE=state VALUE=6
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_begin Step 4/4 - Loading"
    RESPOND TYPE=command MSG="action:prompt_text Feeding into the hotend...   [==========..........] 50%"
    RESPOND TYPE=command MSG="action:prompt_show"
    M83
    G1 E50 F300
    M400
    RESPOND TYPE=command MSG="action:prompt_begin Step 4/4 - Loading"
    RESPOND TYPE=command MSG="action:prompt_text Priming the nozzle...   [================....] 80%"
    RESPOND TYPE=command MSG="action:prompt_show"
    G1 E25 F120
    M400
    RESPOND TYPE=command MSG="action:prompt_begin Step 4/4 - Loading"
    RESPOND TYPE=command MSG="action:prompt_text Purging the old color...   [====================] 100%"
    RESPOND TYPE=command MSG="action:prompt_show"
    G1 E15 F90
    M400
    SET_GCODE_VARIABLE MACRO=FILAMENT_CHANGE VARIABLE=state VALUE=7
    _FC_FINAL_PROMPT

[gcode_macro _FC_PURGE]
gcode:
    {% set fc = printer["gcode_macro FILAMENT_CHANGE"] %}
    {% if fc.state|int == 7 %}
        RESPOND TYPE=command MSG="action:prompt_end"
        RESPOND TYPE=command MSG="action:prompt_begin Purging"
        RESPOND TYPE=command MSG="action:prompt_text Pushing out 10mm more...   [====================]"
        RESPOND TYPE=command MSG="action:prompt_show"
        M109 S{fc.saved_temp}
        M83
        G1 E10 F180
        M400
        _FC_FINAL_PROMPT
    {% endif %}

[gcode_macro _FC_FINAL_PROMPT]
gcode:
    {% set fc = printer["gcode_macro FILAMENT_CHANGE"] %}
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_begin Filament ready"
    {% if fc.mode|int == 1 %}
        RESPOND TYPE=command MSG="action:prompt_text Nozzle {printer.extruder.temperature|int}C. Remove the purged plastic from the nozzle, then continue the print."
        RESPOND TYPE=command MSG="action:prompt_footer_button Purge more|_FC_PURGE|secondary"
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel print|_FC_CANCEL_PRINT|error"
        RESPOND TYPE=command MSG="action:prompt_footer_button Keep paused|_FC_CANCEL|secondary"
        RESPOND TYPE=command MSG="action:prompt_footer_button Continue|_FC_RESUME|primary"
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_text Nozzle {printer.extruder.temperature|int}C. Remove the purged plastic from the nozzle. Done turns the heater off."
        RESPOND TYPE=command MSG="action:prompt_footer_button Purge more|_FC_PURGE|secondary"
        RESPOND TYPE=command MSG="action:prompt_footer_button Done|_FC_CANCEL|primary"
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _FC_RESUME]
gcode:
    {% set fc = printer["gcode_macro FILAMENT_CHANGE"] %}
    {% if fc.state|int != 7 or fc.mode|int != 1 %}
        {action_respond_info("Filament Change: loading has not finished")}
    {% else %}
        SET_GCODE_VARIABLE MACRO=FILAMENT_CHANGE VARIABLE=state VALUE=0
        SET_GCODE_VARIABLE MACRO=FILAMENT_CHANGE VARIABLE=mode VALUE=0
        SET_GCODE_VARIABLE MACRO=FILAMENT_CHANGE VARIABLE=saved_temp VALUE=0
        # Nozzle is already hot; stop RESUME from waiting for it again
        SET_GCODE_VARIABLE MACRO=PRINTER_PARAM VARIABLE=hotend_temp VALUE=0
        RESPOND TYPE=command MSG="action:prompt_end"
        SET_PIN PIN=fan0 VALUE={fc.saved_fan * 255}
        RESTORE_GCODE_STATE NAME=filament_change
        RESUME
    {% endif %}

[gcode_macro _FC_CANCEL]
description: Close the wizard; a paused print stays paused
gcode:
    {% set fc = printer["gcode_macro FILAMENT_CHANGE"] %}
    UPDATE_DELAYED_GCODE ID=_FC_HEAT_TICK DURATION=0
    SET_GCODE_VARIABLE MACRO=FILAMENT_CHANGE VARIABLE=state VALUE=0
    RESPOND TYPE=command MSG="action:prompt_end"
    {% if fc.mode|int == 1 %}
        # Keep the print temperature so RESUME can continue right away
        {% if fc.saved_temp|float >= 170 %}
            M104 S{fc.saved_temp}
        {% endif %}
        SET_PIN PIN=fan0 VALUE={fc.saved_fan * 255}
        RESPOND TYPE=command MSG="Filament Change closed. The print is still paused."
    {% else %}
        M104 S0
    {% endif %}
    {% if fc.saved_temp|float > 0 %}
        RESTORE_GCODE_STATE NAME=filament_change
    {% endif %}
    SET_GCODE_VARIABLE MACRO=FILAMENT_CHANGE VARIABLE=mode VALUE=0
    SET_GCODE_VARIABLE MACRO=FILAMENT_CHANGE VARIABLE=saved_temp VALUE=0

[gcode_macro _FC_CANCEL_PRINT]
gcode:
    _FC_CANCEL
    CANCEL_PRINT

# Only closes the start dialogs. Button presses are queued while the nozzle
# moves, so a stale Cancel must not close a step that opened meanwhile.
[gcode_macro _FC_CLOSE]
gcode:
    {% if printer["gcode_macro FILAMENT_CHANGE"].state|int == 0 %}
        RESPOND TYPE=command MSG="action:prompt_end"
    {% endif %}
